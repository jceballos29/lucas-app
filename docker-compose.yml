services:
  php:
    build:
      context: ./docker/php
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        INSTALL_XDEBUG: ${INSTALL_XDEBUG:-1}
    volumes:
      - ./src:/var/www/html
      # Esquema y seed, de solo lectura: tests/integration.php crea con ellos una BD temporal.
      - ./database:/var/www/database:ro
    # Solo las variables que PHP necesita: ni DB_ROOT_PASSWORD ni las del usuario de migraciones (si la aplicación
    # las conociera, comprometerla daría permisos de esquema; ver bin/as-migrator).
    # Docker Compose las toma del archivo .env.
    environment:
      APP_ENV: ${APP_ENV:-local}
      # Carpetas de configuración de PHP: la de siempre y una por entorno (docker/php/php.local.ini solo
      # existe para "local"). Con cualquier otro APP_ENV no se carga nada más: PHP queda en modo seguro.
      PHP_INI_SCAN_DIR: /usr/local/etc/php/conf.d:/usr/local/etc/php/env/${APP_ENV:-local}
      # Origen público de la aplicación (esquema + host + puerto). Lo usan los POST (reject_foreign_origin()) para aceptar
      # solo peticiones que vienen de este sitio. Por defecto se deriva de APP_PORT.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:${APP_PORT:-8080}}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      # Correo (recuperación de contraseña, RF-04). En desarrollo va al contenedor Mailpit, que lo captura sin enviarlo
      # (se ve en http://127.0.0.1:${MAILPIT_PORT:-8025}). En producción: el SMTP real (ver docs/DESPLIEGUE.md).
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-none}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-lucas@lucas.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Lucas}
    extra_hosts:
      # Permite que Xdebug (dentro del contenedor) llegue a tu editor (en tu máquina)
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    depends_on:
      - php

  db:
    image: mysql:8.4
    # Zona horaria del servidor fija en UTC (las fechas se guardan en UTC; ver format_utc_datetime() en src/app/support.php).
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      # Solo desarrollo: database/04-dev-admin.sh crea el administrador de la seed (clave pública) únicamente si esto vale «local».
      # docker-compose.prod.yml NO define APP_ENV en el servicio db, así que producción nunca nace con esa cuenta (C1, docs/AUDITORIA.md).
      APP_ENV: ${APP_ENV:-local}
      # Sin MYSQL_USER/MYSQL_PASSWORD: la imagen daría ALL sobre la base a ese usuario. Los usuarios se crean con
      # permisos mínimos en database/03-users.sh, que lee estas variables (ver ahí qué puede hacer cada uno).
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-lucas_migrator}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Falta DB_MIGRATION_PASSWORD en .env (ver .env.example)}
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Servidor de correo de DESARROLLO: recibe lo que envía la aplicación y lo muestra en una página web; no envía nada afuera.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  adminer:
    image: adminer:6.3.0
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      - db

volumes:
  db_data:
