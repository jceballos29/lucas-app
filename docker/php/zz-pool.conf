; Pool de procesos de PHP-FPM. Los valores por defecto de la imagen (5 procesos) no alcanzan para RNF-19 (500 usuarios simultáneos):
; un inicio de sesión cuesta ~240 ms de CPU (bcrypt, a propósito) y, con pocos procesos, una oleada de inicios encola todo lo demás.
;
; Se ajustan con variables de entorno (ver docker-compose.yml y docs/DESPLIEGUE.md). Regla práctica:
;   PHP_FPM_MAX_CHILDREN ≈ memoria disponible para PHP / ~40 MB por proceso, sin pasar de las conexiones que admite MySQL
;   (max_connections = 151 por defecto: cada proceso usa UNA conexión mientras atiende una petición).
[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE}
; Un proceso se recicla cada N peticiones: acota cualquier fuga de memoria.
pm.max_requests = 500
