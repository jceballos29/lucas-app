; Ajustes SOLO de producción (APP_ENV=production). Se cargan después de php.ini.

; El código vive dentro de la imagen y no cambia sin reconstruirla (B1): no hace falta comprobar si los archivos cambiaron en cada
; petición. Más rápido, y un archivo modificado por error o por un atacante no se vuelve a compilar.
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
