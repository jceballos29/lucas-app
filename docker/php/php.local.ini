; Ajustes SOLO para desarrollo (APP_ENV=local). Se cargan después de php.ini y lo sobrescriben.

; Mostrar los errores en pantalla para verlos al instante (en cualquier otro entorno quedan fuera).
display_errors = On
display_startup_errors = On

; Revalida los archivos en cada petición para ver los cambios al instante.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
