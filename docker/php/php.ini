; Configuración de PHP SEGURA POR DEFECTO (la que se usa en cualquier entorno).
; Los ajustes de desarrollo van en php.local.ini y solo se cargan con APP_ENV=local
; (ver PHP_INI_SCAN_DIR en docker-compose.yml y el README).

; No revelar la versión de PHP en la cabecera X-Powered-By (information disclosure)
expose_php = Off

; Los errores NO se muestran al visitante (podrían revelar rutas, consultas o claves); se registran en
; el log del contenedor (docker compose logs php). Un fallo grave responde 500.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On

memory_limit = 256M
max_execution_time = 30
max_input_time = 30
date.timezone = America/Bogota

; Evita que PHP-FPM interprete rutas del tipo /script.php/otro.php como PATH_INFO de script.php
cgi.fix_pathinfo = 0

; Subida de comprobantes y CSV limitada a 5 MB (Fase 19); se siguen bloqueando URLs remotas.
file_uploads = On
upload_max_filesize = 5M
max_file_uploads = 5
post_max_size = 6M
allow_url_fopen = Off
allow_url_include = Off

; Valores seguros por defecto para las sesiones (además de lo que fija start_app_session())
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_samesite = Lax

opcache.enable = 1
