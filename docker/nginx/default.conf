# Desarrollo (HTTP). Producción usa production.conf.template (HTTPS): ver docs/DESPLIEGUE.md.
# B2: los tokens de recuperación, verificación e invitación viajan en la URL (?token=…): no se escriben en el registro de accesos.
map $request_uri $uri_sin_token {
    ~^(?<ruta>[^?]*)\?(?<antes>.*?)token=[^&]*(?<despues>.*)$  "$ruta?${antes}token=oculto${despues}";
    default $request_uri;
}
log_format sin_token '$remote_addr - [$time_local] "$request_method $uri_sin_token $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    # No revelar la versión de nginx en la cabecera Server (information disclosure).
    server_tokens off;
    access_log /var/log/nginx/access.log sin_token;

    # Límite acorde con la subida de comprobantes (5 MB + sobrecarga multipart, Fase 19).
    client_max_body_size 6m;
    # U5: un cuerpo mayor que el límite lo corta nginx con un 413 sin pasar por PHP: se muestra una página con la marca, no la de nginx.
    error_page 413 /archivo-demasiado-grande.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Todo lo que no sea un archivo existente va al front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Service Worker y manifiesto PWA (Fase 16): nunca deben quedar en caché inmutable para permitir actualizaciones inmediatas.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Archivos estáticos (RNF-08): comprimidos y con caché larga. La URL lleva ?v=<fecha de modificación> (ver asset() en
    # app/support.php), así que al cambiar un archivo cambia la URL y nadie ve una copia vieja.
    # La compresión se limita a ESTOS archivos y NO se aplica al HTML: una página con el token CSRF y texto reflejado (p. ej. la
    # búsqueda de usuarios) comprimida es vulnerable a BREACH, que adivina secretos midiendo el tamaño de la respuesta.
    location ~* \.(css|js|svg|png|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        gzip on;
        gzip_vary on;
        gzip_comp_level 6;
        gzip_min_length 256;
        gzip_types text/css application/javascript image/svg+xml;
        try_files $uri =404;
    }

    # Los .php se envían a PHP-FPM (servicio "php", puerto 9000) solo si el archivo existe
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Bloquea archivos ocultos (.env, .git, .htaccess...)
    location ~ /\. {
        deny all;
    }
}
