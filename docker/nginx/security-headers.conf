# Cabeceras de seguridad compartidas (incluidas en cada bloque donde se usan: en nginx, un add_header dentro de un `location` REEMPLAZA
# a los del nivel superior, así que se repiten con un include en vez de copiarlas).
#
# - nosniff: el navegador respeta el Content-Type (un CSS que en realidad es HTML no se aplica).
# - X-Frame-Options y frame-ancestors: nadie puede enmarcar la aplicación (clickjacking).
# - Referrer-Policy same-origin: el Referer solo se envía dentro del propio sitio (lo usa reject_foreign_origin() como alternativa a Origin).
# - CSP: todo es propio ('self'): ni CDN ni fuentes externas, y no hay scripts ni estilos en línea. Por eso el diálogo de eliminar usa
#   data-confirm + js/app.js y no un onsubmit en línea, y los iconos son un SVG propio. Si se añade una CDN, un script o un <style> en
#   línea, hay que reflejarlo aquí.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
